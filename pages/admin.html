<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RUBY — Admin Console</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/css/styles.css"/>
<link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16x16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col overflow-x-hidden" data-page="admin">
<div id="nav-root"></div>

<main class="flex-grow w-full max-w-7xl mx-auto px-container-padding-mobile md:px-container-desktop py-8 md:py-12">
  <div id="admin-login-required" class="hidden">
    <div class="max-w-md mx-auto text-center py-16">
      <div class="w-16 h-16 mx-auto rounded-full bg-secondary/10 text-secondary flex items-center justify-center mb-5"><span class="material-symbols-outlined" style="font-size:32px;">admin_panel_settings</span></div>
      <h1 class="font-headline-lg text-headline-lg mb-2">Admin access required</h1>
      <p class="font-body-md text-body-md text-on-surface-variant mb-6">Sign in with the demo admin account (admin@ruby.demo / admin123) to manage the platform.</p>
      <a href="/pages/login.html?next=/pages/admin.html" class="btn btn-primary px-8 py-3.5 rounded-xl hover:bg-primary-container transition-all">Sign in as admin →</a>
    </div>
  </div>

  <div id="admin-dash" class="hidden">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <span class="font-label-caps text-label-caps text-secondary">Admin Console</span>
        <h1 class="font-headline-lg text-headline-lg mt-1">Control center</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Approve appeals, verify hospitals, and track disbursements on the prototype.</p>
      </div>
      <a href="/pages/ledger.html" class="border border-secondary text-secondary font-label-caps text-label-caps px-5 py-3 rounded-xl hover:bg-secondary/5 transition-all">View transparency ledger →</a>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8" id="ad-stats">
      <div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div>
    </div>

    <!-- Tabs -->
    <div class="flex flex-wrap gap-2 mb-8" id="admin-tabs" role="tablist">
      <button class="admin-tab px-5 py-2.5 rounded-xl font-label-caps text-label-caps bg-primary text-on-primary" data-tab="overview">Overview</button>
      <button class="admin-tab px-5 py-2.5 rounded-xl font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container" data-tab="appeals">Appeals</button>
      <button class="admin-tab px-5 py-2.5 rounded-xl font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container" data-tab="hospitals">Hospitals</button>
      <button class="admin-tab px-5 py-2.5 rounded-xl font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container" data-tab="disbursements">Disbursements</button>
      <button class="admin-tab px-5 py-2.5 rounded-xl font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container" data-tab="patients">Patients</button>
      <button class="admin-tab px-5 py-2.5 rounded-xl font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container" data-tab="donations">Donations</button>
    </div>

    <div id="tab-overview" class="admin-panel"></div>
    <div id="tab-appeals" class="admin-panel hidden"></div>
    <div id="tab-hospitals" class="admin-panel hidden"></div>
    <div id="tab-disbursements" class="admin-panel hidden"></div>
    <div id="tab-patients" class="admin-panel hidden"></div>
    <div id="tab-donations" class="admin-panel hidden"></div>
  </div>
</main>

<div id="footer-root"></div>

<script src="/js/storage.js"></script>
<script src="/js/api.js"></script>
<script src="/js/validation.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
