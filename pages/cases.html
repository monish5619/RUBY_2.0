<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RUBY — Find Medical Cases</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/css/styles.css"/>
<link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16x16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col overflow-x-hidden" data-page="cases">
<div id="nav-root"></div>

<main class="flex-grow w-full max-w-7xl mx-auto px-container-padding-mobile md:px-container-desktop py-8 md:py-12">
  <div class="mb-8">
    <span class="eyebrow">Case Discovery</span>
    <h1 class="section-title text-on-surface mt-3 mb-2">Find a medical case to support</h1>
    <p class="font-body-md text-body-md text-on-surface-variant max-w-2xl">Every case below is verified by a partner hospital and approved for public fundraising.</p>
  </div>

  <!-- Search + filters -->
  <div class="panel p-5 mb-8">
    <div class="flex flex-col lg:flex-row gap-4">
      <div class="relative flex-1">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
        <input class="field-input pl-12" id="filter-search" type="search" placeholder="Search treatment, diagnosis, hospital, city…" aria-label="Search cases"/>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <select class="field-input" id="filter-category" aria-label="Filter by treatment">
          <option value="">All treatments</option>
          <option>Cardiac</option>
          <option>Oncology</option>
          <option>Trauma / Emergency</option>
          <option>Kidney / Nephrology</option>
          <option>Paediatric</option>
          <option>General Surgery</option>
        </select>
        <select class="field-input" id="filter-urgency" aria-label="Filter by urgency">
          <option value="">Any urgency</option>
          <option>CRITICAL</option>
          <option>HIGH</option>
          <option>MEDIUM</option>
        </select>
        <select class="field-input" id="filter-status" aria-label="Filter by funding status">
          <option value="">Any funding status</option>
          <option value="FUNDRAISING">Fundraising</option>
          <option value="FUNDED">Funded</option>
          <option value="DISBURSED">Disbursed</option>
        </select>
        <select class="field-input" id="sort-by" aria-label="Sort cases">
          <option value="urgency">Sort: Urgency</option>
          <option value="newest">Sort: Newest</option>
          <option value="raised">Sort: Most raised</option>
          <option value="target">Sort: Highest target</option>
        </select>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-between mb-4">
    <p class="font-body-sm text-body-sm text-on-surface-variant" id="result-count">Loading…</p>
    <button class="text-secondary font-label-caps text-label-caps hover:underline" id="filter-clear">Clear filters</button>
  </div>

  <div id="cases-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
    <div class="skeleton h-80"></div><div class="skeleton h-80"></div><div class="skeleton h-80"></div>
  </div>
</main>

<div id="footer-root"></div>

<script src="/js/storage.js"></script>
<script src="/js/api.js"></script>
<script src="/js/validation.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cases.js"></script>
<script src="/js/case-list.js"></script>
</body>
</html>
